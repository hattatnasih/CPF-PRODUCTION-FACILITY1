name: Build Play Store release (AAB)
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check secrets
        env: { KS: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: test -n "$KS" || (echo "Missing secret KEYSTORE_BASE64" && exit 1)
      - name: Sync web files into Android
        run: |
          npm install
          npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: northfield-cpf-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
